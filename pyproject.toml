[project]
name = "asteroids"
version = "0.1.0"
description = ""
authors = [{ name = "Garrett Anderson", email = "g@devnull.rip" }]
readme = "README.md"
requires-python = ">=3.13"

dependencies = ["pygame (>=2.6.1,<3.0.0)"]

[tool.poetry.scripts]
asteroids = "asteroids.__main__:main"

[tool.poetry]
packages = [{ include = "asteroids", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = ["pytest (>=9.0.2,<10.0.0)"]
